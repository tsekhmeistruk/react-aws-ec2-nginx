name: Playwright Tests - Manual Trigger

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        type: choice
        options:
          - dev
          - staging
          - both
        default: 'dev'
      browser:
        description: 'Browser to test'
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
        default: 'all'
      headed:
        description: 'Run in headed mode'
        required: false
        type: boolean
        default: false

jobs:
  test-manual:
    name: Manual Test Run - ${{ github.event.inputs.environment }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Build application (for dev)
      if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'both'
      run: npm run build

    - name: Start application server (for dev)
      if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'both'
      run: |
        npm start &
        npx wait-on http://localhost:3000 --timeout 120000

    - name: Run tests on Dev - All browsers
      if: (github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'both') && github.event.inputs.browser == 'all'
      run: npx playwright test --project=chromium-dev --project=firefox-dev --project=webkit-dev
      env:
        BASE_URL: http://localhost:3000

    - name: Run tests on Dev - Specific browser
      if: (github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'both') && github.event.inputs.browser != 'all'
      run: npx playwright test --project=${{ github.event.inputs.browser }}-dev
      env:
        BASE_URL: http://localhost:3000

    - name: Run tests on Staging - All browsers
      if: (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'both') && github.event.inputs.browser == 'all'
      run: npx playwright test --project=chromium-staging --project=firefox-staging --project=webkit-staging
      env:
        STAGING_URL: ${{ secrets.STAGING_URL || 'https://staging.example.com' }}

    - name: Run tests on Staging - Specific browser
      if: (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'both') && github.event.inputs.browser != 'all'
      run: npx playwright test --project=${{ github.event.inputs.browser }}-staging
      env:
        STAGING_URL: ${{ secrets.STAGING_URL || 'https://staging.example.com' }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-manual-results-${{ github.event.inputs.environment }}-${{ github.event.inputs.browser }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-manual-report-${{ github.event.inputs.environment }}-${{ github.event.inputs.browser }}
        path: playwright-report/
        retention-days: 30

    - name: Comment PR with results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const resultsPath = 'test-results/results.json';
          
          if (fs.existsSync(resultsPath)) {
            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const { stats } = results;
            
            const comment = `## 🎭 Playwright Test Results
            
            **Environment:** ${{ github.event.inputs.environment }}
            **Browser:** ${{ github.event.inputs.browser }}
            
            - ✅ Passed: ${stats.expected || 0}
            - ❌ Failed: ${stats.unexpected || 0}
            - ⏭️ Skipped: ${stats.skipped || 0}
            - 🔄 Flaky: ${stats.flaky || 0}
            
            [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
